# soju's and nginx's configuration from /usr/share/factory/etc, for a machine
# whose /etc starts empty (see etc.conf). soju's is linked file by file, so
# that /etc/soju is a directory that a confext can add files to; nginx's tree
# is linked whole, so a confext changing it has to carry all of it.
L /etc/soju/config
L? /etc/nginx
