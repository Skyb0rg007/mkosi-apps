# Configuration from /usr/share/factory/etc, for a machine whose /etc starts
# empty (see etc.conf). Nextcloud's is linked file by file, so that
# /etc/nextcloud is a directory that a confext can add files to; PHP's tree is
# linked whole, so a confext changing it has to carry all of it.
L /etc/nextcloud/image.config.php
L? /etc/php
