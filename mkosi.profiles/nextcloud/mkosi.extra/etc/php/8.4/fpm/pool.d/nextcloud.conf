; Nextcloud's pool, as its user, for nginx (www-data) to connect to. The
; process manager's settings are those of Nextcloud's admin manual.
[nextcloud]
user = nextcloud
group = nextcloud

listen = /run/php/nextcloud.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

; PHP-FPM clears the environment; Nextcloud needs a PATH, and its configuration
; directory (see /usr/bin/occ).
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[NEXTCLOUD_CONFIG_DIR] = /var/lib/nextcloud/config
