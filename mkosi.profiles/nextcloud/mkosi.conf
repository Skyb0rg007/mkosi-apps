[Include]
Include=
        %D/mkosi.include/postgresql
        %D/mkosi.include/redis
        %D/mkosi.include/nginx

[Output]
ImageId=nextcloud

[Content]
# The PHP modules Nextcloud requires and those its setup checks recommend.
Packages=
        php8.4-apcu
        php8.4-bcmath
        php8.4-cli
        php8.4-common
        php8.4-curl
        php8.4-fpm
        php8.4-gd
        php8.4-gmp
        php8.4-imagick
        php8.4-intl
        php8.4-mbstring
        php8.4-opcache
        php8.4-pgsql
        php8.4-redis
        php8.4-xml
        php8.4-zip
        # SVG for imagick, which theming uses.
        libmagickcore-7.q16-10-extra

[Runtime]
# mkosi boot/vm name the machine this, not after the versioned output.
Machine=nextcloud
