# Jellyfin's directories, which the package creates in the image's /var, not the
# machine's (see /etc/default/jellyfin).
d /var/lib/jellyfin 0750 jellyfin jellyfin -
d /var/lib/jellyfin/config 0750 jellyfin jellyfin -
d /var/cache/jellyfin 0750 jellyfin jellyfin -
d /var/log/jellyfin 0750 jellyfin jellyfin -

# Serve on port 80 rather than 8096. Jellyfin takes its port from its network
# configuration only, and fills in defaults for everything this leaves out. It
# is created once, so a port set in the web UI later stays.
f /var/lib/jellyfin/config/network.xml 0640 jellyfin jellyfin - <?xml version="1.0" encoding="utf-8"?><NetworkConfiguration><InternalHttpPort>80</InternalHttpPort></NetworkConfiguration>
