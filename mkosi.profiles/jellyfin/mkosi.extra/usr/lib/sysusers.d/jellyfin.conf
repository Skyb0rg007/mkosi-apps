# The package creates jellyfin in its postinst and ships no sysusers.d entry, so
# a machine whose /etc starts empty would not get it. Mirrors the postinst,
# which also adds it to the groups that own GPUs, for hardware transcoding.
u jellyfin - "Jellyfin default user" /var/lib/jellyfin /bin/false
m jellyfin render
m jellyfin video
