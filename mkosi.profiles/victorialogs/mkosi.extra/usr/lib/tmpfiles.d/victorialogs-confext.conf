# A configuration extension that systemd-confext merges over /etc on boot or
# `systemd-confext refresh`, so that /etc/victorialogs/ can be configured
# although the image's /etc is read-only.
d /var/lib/confexts/victorialogs/etc/victorialogs 0755 root root -
f /var/lib/confexts/victorialogs/etc/extension-release.d/extension-release.victorialogs 0644 root root - ID=_any
