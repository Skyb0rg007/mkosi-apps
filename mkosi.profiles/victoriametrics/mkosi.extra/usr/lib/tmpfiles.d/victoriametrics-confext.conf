# A configuration extension that systemd-confext merges over /etc on boot or
# `systemd-confext refresh`, so that /etc/victoriametrics/ can be configured
# although the image's /etc is read-only. Files under its
# etc/victoriametrics/ replace the image's.
d /var/lib/confexts/victoriametrics/etc/victoriametrics 0755 root root -
f /var/lib/confexts/victoriametrics/etc/extension-release.d/extension-release.victoriametrics 0644 root root - ID=_any
