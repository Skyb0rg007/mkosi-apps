# Configure Miniflux from system credentials (see /usr/libexec/miniflux-start)
# and, unless miniflux.database-url points elsewhere, a local PostgreSQL.
[Unit]
Wants=miniflux-postgresql-setup.service
After=miniflux-postgresql-setup.service

[Service]
ImportCredential=miniflux.*
ExecStart=
ExecStart=/usr/libexec/miniflux-start
