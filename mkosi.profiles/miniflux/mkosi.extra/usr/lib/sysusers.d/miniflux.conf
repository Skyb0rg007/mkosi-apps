u miniflux - "Miniflux service user" /var/empty /usr/sbin/nologin

# Debian creates postgres in postgresql-common's postinst and ships no sysusers.d
# entry, so a machine that keeps its /etc across /usr upgrades would not get it.
# Mirrors the postinst.
u postgres - "PostgreSQL administrator" /var/lib/postgresql /bin/bash
m postgres ssl-cert
