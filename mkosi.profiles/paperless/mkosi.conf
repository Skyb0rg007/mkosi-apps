[Include]
Include=
        %D/mkosi.include/python
        %D/mkosi.include/redis

[Output]
ImageId=paperless

[Content]
# The runtime packages of upstream's container image, less the database
# clients: OCR in English, German, French, Italian and Spanish.
Packages=
        file
        fonts-liberation
        ghostscript
        gnupg
        icc-profiles-free
        imagemagick
        jbig2dec
        libmagic1
        # psycopg's pure-Python implementation, for PAPERLESS_DBENGINE=postgresql.
        libpq5
        libxml2
        libxslt1.1
        media-types
        pngquant
        poppler-utils
        qpdf
        tesseract-ocr
        tesseract-ocr-deu
        tesseract-ocr-eng
        tesseract-ocr-fra
        tesseract-ocr-ita
        tesseract-ocr-spa
        tzdata
        unpaper
        zlib1g

[Runtime]
# mkosi boot/vm name the machine this, not after the versioned output.
Machine=paperless
