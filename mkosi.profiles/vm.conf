# Bootable disk for systemd-vmspawn; combine with an app profile:
#
#     mkosi --profile=soju,vm build
[Output]
Format=disk
# For a disk image mkosi also creates a symlink named like a directory build's
# output (soju_0.10.1-1 -> soju_0.10.1-1.raw), so keep the two formats apart.
OutputDirectory=%D/mkosi.output/vm

[Content]
Bootable=yes
Packages=
        linux-image-amd64
        systemd-boot
        systemd-boot-efi
        udev

[Runtime]
# A tap interface for mkosi vm needs root; use QEMU's user-mode networking.
RuntimeNetwork=user
