[Include]
Include=
        %D/mkosi.include/postgresql
        %D/mkosi.include/redis

[Output]
ImageId=immich

[Content]
Packages=
        # Packages mkosi.sync downloads into mkosi.packages/: upstream's
        # ffmpeg, and VectorChord, the vector search that Immich's database
        # needs, on pgvector.
        jellyfin-ffmpeg7
        postgresql-17-vchord
        postgresql-17-pgvector
        # exiftool, which the server bundles, is Perl.
        perl
        # What the libraries from upstream's image link to, as upstream's
        # image installs them.
        libaom3
        libbrotli1
        libcairo2
        libdav1d7
        libde265-0
        libexif12
        libexpat1
        libfontconfig1
        libgomp1
        libgsf-1-114
        libhwy1t64
        liblcms2-2
        liblqr-1-0
        libltdl7
        libopenexr-3-1-30
        libopenjp2-7
        libpango-1.0-0
        libpangocairo-1.0-0
        librsvg2-2
        libspng0
        libtiff6
        libwebp7
        libwebpdemux2
        libwebpmux3
        libx11-6
        libxext6
        libxml2

[Runtime]
# mkosi vm names the machine this, not after the versioned output.
Machine=immich
