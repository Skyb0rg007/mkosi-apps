# The disk image as built: the ESP with systemd-boot and the UKI, and the image's
# /usr with its verity hashes, the A slot. The first boot adds the rest (see
# /usr/lib/repart.d). Like ParticleOS's, less the verity signature.
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
# Two UKIs, the booted one and an update.
SizeMinBytes=512M
SizeMaxBytes=512M
