# Bootable disk for VMs, with A/B updates of its /usr through
# systemd-sysupdate; combine with an app profile:
#
#     mkosi --profile=soju,vm build
#
# See docs/vm.md.
[Output]
Format=disk
# For a disk image mkosi also creates a symlink named like a directory build's
# output (soju_0.10.1-1 -> soju_0.10.1-1.raw), so keep the two formats apart.
OutputDirectory=%D/mkosi.output/vm
# The update's parts beside the disk image: the /usr partition and its verity
# hashes (mkosi.repart/), and the UKI.
SplitArtifacts=
        uki
        partitions

[Content]
Bootable=yes
# Named like the images, so that systemd-sysupdate recognizes the image's own
# UKI as a version, as it does the ones it installs.
UnifiedKernelImageFormat=%i_%v
Packages=
        linux-image-amd64
        systemd-boot
        systemd-boot-efi
        udev
        # Mount units, such as the ESP's, which nspawn does for a container.
        mount
        # systemd-sysupdate, and systemd-pull, which it downloads with, and the
        # libcurl that dlopens.
        systemd-container
        libcurl4t64
        # Verifies SHA256SUMS.gpg for systemd-pull.
        gpg
        # Adds the partitions of the B slot and the root partition on the first
        # boot, from repart.d.
        systemd-repart

[Runtime]
# A tap interface for mkosi vm needs root; use QEMU's user-mode networking.
RuntimeNetwork=user
# Room for what the first boot adds: the B slot and the root partition.
RuntimeSize=16G
