[Include]
Include=
        %D/mkosi.include/postgresql
        %D/mkosi.include/nginx

[Output]
ImageId=cdash

[Content]
# The PHP modules CDash requires (composer.json) and those upstream's image
# builds in.
Packages=
        php8.4-bcmath
        php8.4-bz2
        php8.4-cli
        php8.4-common
        php8.4-curl
        php8.4-fpm
        php8.4-gd
        php8.4-ldap
        php8.4-mbstring
        php8.4-opcache
        php8.4-pgsql
        php8.4-xml

[Runtime]
# mkosi vm names the machine this, not after the versioned output.
Machine=cdash
