; CDash's pool, as its user, for nginx (www-data) to connect to.
[cdash]
user = cdash
group = cdash

listen = /run/php/cdash.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; CDash's settings are environment variables, which systemd gives PHP-FPM
; (see php8.4-fpm.service.d/cdash.conf); keep them.
clear_env = no
