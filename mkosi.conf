[Distribution]
Distribution=debian
Release=trixie

[Config]
Dependencies=
        # minimal-base
        # debug-sysext

        # miniflux
        # homebox
        soju

[Output]
Format=none
OutputDirectory=mkosi.output

[Build]
Incremental=true
CacheDirectory=mkosi.cache
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# Sync scripts run in the tools tree; soju's fetches its Go modules there.
ToolsTreePackages=golang-go

[Content]
Packages=
        systemd
        login
        openssl
        ca-certificates
        curl
        iproute2
        systemd-resolved
        vim
PackageDirectories=mkosi.packages

WithRecommends=no
WithDocs=no
CleanPackageMetadata=yes
