[Distribution]
Distribution=debian
Release=trixie

# Each app is a profile in mkosi.profiles/ that makes it the main image:
#
#     mkosi --profile=soju build        # rootless nspawn directory
#     mkosi --profile=soju,vm build     # bootable disk for systemd-vmspawn
#
# Without an app profile this builds the bare base image.
[Config]
Dependencies=
        minimal-base
        # debug-sysext

[Output]
Format=directory
OutputDirectory=mkosi.output

[Build]
Incremental=true
CacheDirectory=mkosi.cache
ToolsTree=yes
ToolsTreeDistribution=debian
# testing, not trixie: ForeignUIDRange= needs systemd-dissect --shift (258+).
ToolsTreeRelease=testing
# Sync scripts run in the tools tree; soju's fetches its Go modules there, and
# the Python apps' download their wheels with pip.
# udev ships systemd-hwdb, which testing's systemd no longer pulls in.
ToolsTreePackages=
        golang-go
        python3-pip
        udev
# Own the directory image by the foreign UID range, which rootless
# systemd-nspawn --directory= requires. mkosi gets that range from
# systemd-nsresourced, with no privileges.
ForeignUIDRange=yes

[Content]
BaseTrees=%O/minimal-base
# minimal-base's files again, after the app's packages: those can upgrade
# minimal-base's, which would overwrite files it replaces, such as systemd's
# tmpfiles.d/etc.conf.
ExtraTrees=%D/mkosi.images/minimal-base/mkosi.extra
PackageDirectories=mkosi.packages

WithRecommends=no
WithDocs=no
CleanPackageMetadata=yes

[Runtime]
# mkosi boot: a veth link the host's networkd serves (80-namespace-ns.network).
RuntimeNetwork=interface
# Boot a copy, so that outputs stay as built for bin/install-app.
Ephemeral=yes
