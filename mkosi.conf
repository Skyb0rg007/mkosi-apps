[Distribution]
Distribution=debian
Release=trixie

[Config]
Dependencies=
        # minimal-base
        # debug-sysext

        # miniflux
        # homebox
        soju

[Output]
Format=directory
OutputDirectory=mkosi.output

[Build]
Incremental=true
CacheDirectory=mkosi.cache
ToolsTree=yes
ToolsTreeDistribution=debian
# testing, not trixie: ForeignUIDRange= needs systemd-dissect --shift (258+).
ToolsTreeRelease=testing
# Sync scripts run in the tools tree; soju's fetches its Go modules there.
# udev ships systemd-hwdb, which testing's systemd no longer pulls in.
ToolsTreePackages=
        golang-go
        udev
# Own the directory image by the foreign UID range, which rootless
# systemd-nspawn --directory= requires. mkosi gets that range from
# systemd-nsresourced, with no privileges.
ForeignUIDRange=yes

[Content]
Packages=
        systemd
        login
        openssl
        ca-certificates
        curl
        iproute2
        systemd-resolved
        vim
PackageDirectories=mkosi.packages
# mkosi.postinst.chroot moves /etc/pam.d to /usr/lib/pam.d like minimal-base's
# does, so this image needs minimal-base's tmpfiles link back, without which
# Debian's PAM finds no configuration and every login fails.
ExtraTrees=mkosi.images/minimal-base/mkosi.extra

WithRecommends=no
WithDocs=no
CleanPackageMetadata=yes
