[Config]
Dependencies=minimal-base

[Output]
Format=disk

[Content]
Bootable=yes
BaseTrees=%O/minimal-base

Packages=
    sqlite3
    systemd-boot
    systemd-boot-efi
    linux-image-amd64
    udev

BuildPackages=
    build-essential
    libsqlite3-dev
    golang-go
    scdoc

WithRecommends=no
WithDocs=no
CleanPackageMetadata=yes
