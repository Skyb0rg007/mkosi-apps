# Keep /etc writable with confexts merged, since tmpfiles, sysusers, ldconfig
# and the like still write to it: writes land in
# /var/lib/extensions.mutable/etc/, above the confexts, which are above the
# machine's own /etc. The default mount options for this include
# redirect_dir=on, which overlayfs refuses in a user namespace, as in these
# containers; userxattr is what it needs there instead. A plain
# `systemd-confext refresh` lacks these settings and merges read-only, so
# restart this unit instead.
[Service]
Environment=SYSTEMD_CONFEXT_MUTABLE_MODE=yes
Environment=SYSTEMD_CONFEXT_OVERLAYFS_MOUNT_OPTIONS=userxattr,noatime,metacopy=off,index=off
