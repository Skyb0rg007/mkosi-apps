# From ParticleOS, less what these images do not ship: symlink entries of /etc
# to /usr/share/factory/etc (see mkosi.finalize) instead of copying them, so
# that updates to /usr propagate. On an image's own /etc they all exist already.
L /etc/os-release - - - - ../usr/lib/os-release
L+ /etc/mtab - - - - ../proc/self/mounts
# Contains the default systemd locale
L /etc/locale.conf
L /etc/nsswitch.conf
L /etc/profile
L /etc/profile.d
# Required by pam_env plugin
L /etc/security
L? /etc/bash.bashrc
# Canonical location to look for certificates
L? /etc/ca-certificates
L /etc/ssh/ssh_config.d
# Canonical location to look for certificates
L /etc/ssl
# Required by pam environment plugin
L /etc/environment
L /etc/xdg
# Configuration for ldconfig
L /etc/ld.so.conf
L /etc/ld.so.conf.d
L? /etc/skel
# On some distributions various binaries in /usr/bin are managed via
# /etc/alternatives.
L? /etc/alternatives
