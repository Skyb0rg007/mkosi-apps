[Output]
Format=directory
# Fixed name: the main image's ImageVersion= is passed down to subimages and
# would otherwise version this output, which BaseTrees=%O/minimal-base names.
Output=minimal-base

[Content]
Locale=C.UTF-8
WithDocs=no
CleanPackageMetadata=yes

Packages=
        systemd
        login
        libpam-runtime
        libpam-modules
        openssl
        # kill, for the units' ExecReload=, plus ps and friends.
        procps
        ca-certificates
        systemd-resolved
        # The modules Debian's nsswitch.conf names: localhost and the host name
        # without /etc/hosts, even before systemd-resolved runs, and the users
        # of DynamicUser=.
        libnss-myhostname
        libnss-resolve
        libnss-systemd
        # /etc/services and /etc/protocols.
        netbase
