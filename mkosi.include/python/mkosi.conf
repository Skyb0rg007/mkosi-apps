# Python apps that install their dependencies into a virtualenv from wheels,
# for profiles that include this directory:
#
#     [Include]
#     Include=%D/mkosi.include/python
#
# Their sync script downloads the wheels of a hashed lockfile with
# download-wheels, and their build script installs them offline into a
# virtualenv with install-wheels.
[Content]
Packages=
        python3

BuildPackages=
        python3-venv
        # Builds the pure-Python packages that publish no wheel.
        python3-setuptools
